---
name: 01 Multi-Service Parallel Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-vote:
    name: Build Vote Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build locally for scanning and testing
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          load: true
          tags: esatarslan/vote:test-scan
          push: false
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit testing in Docker
        run: |
          docker run --rm esatarslan/vote:test-scan echo "testing of test"
      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'esatarslan/vote:test-scan'
          exit-code: 0
          format: table
          severity: 'CRITICAL,HIGH'
      - name: Login to ghcr.io registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ghcr.io/esatarslan/vote:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: "test-cluster-1"
          args: >-
            --agents 1
            --non-blocking
            --k3s-arg "--no-deploy=traefik,servicelb,metrics-server@server:*"
      - name: Smoke test deployment in k3d kubernetes
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          export TESTING_IMAGE=ghcr.io/esatarslan/vote:"$GITHUB_RUN_ID"
          envsubst < manifests/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment myapp
          kubectl exec deploy/myapp -- curl --fail localhost:80
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: esatarslan/vote
          flavor: |
            latest = false
          tags: |
            type=raw,value=06
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and Push Vote
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-result:
    name: Build Result Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build locally for scanning and testing
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          load: true
          tags: esatarslan/vote:test-scan
          push: false
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit testing in Docker
        run: |
          docker run --rm esatarslan/vote:test-scan echo "testing of test"


      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'esatarslan/vote:test-scan'
          exit-code: 0
          format: table
          severity: 'CRITICAL,HIGH'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: esatarslan/result
          flavor: |
            latest = false
          tags: |
            type=raw,value=06
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and Push Result
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build locally for scanning and testing
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          load: true
          tags: esatarslan/vote:test-scan
          push: false
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit testing in Docker
        run: |
          docker run --rm esatarslan/vote:test-scan echo "testing of test"


      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'esatarslan/vote:test-scan'
          exit-code: 0
          format: table
          severity: 'CRITICAL,HIGH'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: esatarslan/worker
          flavor: |
            latest = false
          tags: |
            type=raw,value=06
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
